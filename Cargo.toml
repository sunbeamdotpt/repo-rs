[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["repo-rs contributors"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunbeamdotpt/repo-rs"

[workspace.dependencies]
# Internal crates
repo-rs-manifest = { path = "crates/repo-rs-manifest", version = "0.1.0" }
repo-rs-model = { path = "crates/repo-rs-model", version = "0.1.0" }
repo-rs-git = { path = "crates/repo-rs-git", version = "0.1.0" }
repo-rs-engine = { path = "crates/repo-rs-engine", version = "0.1.0" }
repo-rs-cmd = { path = "crates/repo-rs-cmd", version = "0.1.0" }
repo-rs-cli = { path = "crates/repo-rs-cli", version = "0.1.0" }

# Core
git2 = "0.21"
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
anstream = "1.0.0"
indicatif = "0.18.4"

# Data
serde = { version = "1.0.228", features = ["derive"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
indexmap = "2.14.0"
url = "2.5.8"
camino = "1.2.2"

# Async / Parallel
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
async-trait = "0.1.89"
rayon = "1.12.0"

# Testing
mockall = "0.13.0"

# Utils
tempfile = "3.27.0"
regex = "1.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
cargo = "warn"
